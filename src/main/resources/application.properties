# ===========================================================
#              FindMe - Configuration de l'application
# ===========================================================
# Spring Boot 4.1.0 | Java 26 | MySQL 8.4 (Docker)
# Docker-compose : db=findme, user=findme_user, pwd=findme_pwd
# ===========================================================

# Nom de l'application
spring.application.name=findme

# ===========================================================
#                BASE DE DONNEES MYSQL (Docker)
# ===========================================================
# Le conteneur Docker expose MySQL sur le port 3306 local.
# createDatabaseIfNotExist=true : cree la DB si elle n'existe pas.
# allowPublicKeyRetrieval=true  : requis avec MySQL 8+ en local.
spring.datasource.url=jdbc:mysql://localhost:3306/findme?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=findme_user
spring.datasource.password=findme_pwd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================================
#                    JPA / HIBERNATE
# ===========================================================
# update : met a jour le schema sans supprimer les donnees existantes.
# En production, utiliser Flyway ou Liquibase a la place.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Desactive l'initialisation de schema via data.sql (utilise Hibernate DDL)
spring.jpa.defer-datasource-initialization=false

# ===========================================================
#                       PAGINATION
# ===========================================================
# Taille de page par defaut pour les endpoints pagines
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===========================================================
#                       ACTUATOR
# ===========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=FindMe API
info.app.version=1.0.0

# ===========================================================
#                    SWAGGER / OPENAPI
# ===========================================================
# Swagger UI accessible via : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ===========================================================
#                         JWT
# ===========================================================
# Cle secrete Base64 pour signer les tokens JWT (256 bits minimum)
# IMPORTANT : changer cette valeur en production et la stocker
# dans des variables d'environnement ou un vault (ex: AWS Secrets Manager)
app.jwt.secret=ZmluZG1lLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLW11c3QtYmUtMjU2LWJpdHMtbG9uZy1hdC1taW5pbXVtLXJlcGxhY2UtaW4tcHJvZA==
# Duree de validite du token JWT en millisecondes (24h = 86400000 ms)
app.jwt.expiration-ms=86400000

# ===========================================================
#                         LOGGING
# ===========================================================
logging.level.com.example.findme=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
