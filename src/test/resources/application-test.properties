# ===========================================================
#         FindMe - Profil de test (H2 en memoire)
# ===========================================================
# Ce profil est active automatiquement lors des tests
# via @ActiveProfiles("test") ou @DataJpaTest.
# Il remplace MySQL par une base H2 en memoire pour les tests
# unitaires, sans necessiter un conteneur Docker actif.
# ===========================================================

# Base H2 en memoire - ne persiste pas entre les tests
spring.datasource.url=jdbc:h2:mem:findme_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA en mode test : recree le schema a chaque execution
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Desactiver les logs verbeux en mode test
logging.level.org.springframework=WARN
logging.level.com.example.findme=WARN
logging.level.org.hibernate=WARN

# JWT - cle de test (non secrete, uniquement pour les tests)
app.jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-environment
app.jwt.expiration-ms=3600000
