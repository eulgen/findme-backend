services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: findme
      MYSQL_USER: findme_user
      MYSQL_PASSWORD: findme_pwd
      MYSQL_ROOT_PASSWORD: findme_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: