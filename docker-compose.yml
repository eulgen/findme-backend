services:
  auth-service:
    build:
      context: .
    container_name: auth-service
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://auth-db:5432/findme_db
      - DB_USER=${DB_USER:-findme_user}
      - DB_PASSWORD=${DB_PASSWORD:-findme_password}
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH}
    depends_on:
      auth-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      - POSTGRES_DB=findme_db
      - POSTGRES_USER=${DB_USER:-findme_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-findme_password}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-findme_user} -d findme_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: findme-mailpit
    restart: always
    ports:
      - "1025:1025" # Serveur SMTP
      - "8025:8025" # Web UI consultation des mails (http://localhost:8025)

volumes:
  auth-db-data:
