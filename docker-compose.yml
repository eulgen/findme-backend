services:
  auth-service:
    build:
      context: .
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://auth-db:5432/findme_db
      - DB_USER=findme_user
      - DB_PASSWORD=findme_password
      - JWT_SECRET=dGhpc19pc19hX3Zlcnlfc2VjdXJlX2xvbmdfc2VjcmV0X2tleV9mb3Jfand0X3NpZ25pbmdfYW5kX3ZlcmlmaWNhdGlvbl8xMjM0NTY3ODkw
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      - POSTGRES_DB=findme_db
      - POSTGRES_USER=findme_user
      - POSTGRES_PASSWORD=findme_password
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme_user -d findme_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth-db-data:
