name: Backend CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Installer les dépendances
        run: ./mvnw dependency:resolve